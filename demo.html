<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Square Grid</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
   
  </style>
</head>

<body>
  <section class="bg-zinc-950 p-6 md:p-12 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-7xl">
      <div class="grid-layout">
        <div class="aspect-square lg:aspect-auto lg:h-[294px] lg:w-[245px]">
          <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=800&q=80%22"
            class=" w-full h-full object-cover rounded-sm shadow-xl" alt="Team">
        </div>
        <div class="aspect-square lg:aspect-auto lg:h-[416px] lg:w-[245px] lg:row-span-2">
          <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=800&q=80%22"
            class=" w-full h-full object-cover rounded-sm shadow-xl" alt="Meeting">
        </div>
        <div class="aspect-square lg:aspect-auto lg:h-[294px] lg:w-[245px] lg:row-span-2">
          <img src="https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&w=800&q=80%22"
            class=" w-full h-full object-cover rounded-sm shadow-xl" alt="Designing">
        </div>
        <div class="aspect-square lg:aspect-auto lg:h-[196px] lg:w-[245px]">
          <img src="https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=800&q=80%22"
            class=" w-full h-full object-cover rounded-sm shadow-xl" alt="Brainstorming">
        </div>
        <div class="aspect-square lg:aspect-auto lg:h-[294px] lg:w-[245px]">
          <img src="https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&w=800&q=80%22"
            class=" w-full h-full object-cover rounded-sm shadow-xl" alt="Presentation">
        </div>
        <div class="aspect-square lg:aspect-auto lg:h-[196px] lg:w-[245px]">
          <img src="https://images.unsplash.com/photo-1521737604893-d14cc237f11d?auto=format&fit=crop&w=800&q=80%22"
            class=" w-full h-full object-cover rounded-sm shadow-xl" alt="Hands">
        </div>
        <div class="aspect-video lg:aspect-auto lg:h-[196px] lg:w-[514px] col-span-2">
          <img src="https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=1200&q=80%22"
            class=" w-full h-full object-cover rounded-sm shadow-xl" alt="Group">
        </div>
      </div>
    </div>
  </section>
</body>

</html>
